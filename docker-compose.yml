services:
  backend:
    build: ./backend/techsapce
    container_name: backend_ecom
    volumes:
      - ./backend/techsapce:/app
    ports:
      -  "8000:8000"
    command: gunicorn techsapce.wsgi:application --bind 0.0.0.0:8000
    
  frontend:
    build: ./frontend
    container_name: frontend_ecom
    ports:
      - "3000:80"
    depends_on:
      - backend
